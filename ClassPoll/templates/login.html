{% extends "base.html" %}
{% block title %}Log in | ClassPoll{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="panel auth-panel" method="post">
  <div class="eyebrow">WELCOME BACK</div><h1>Log in to ClassPoll</h1><p class="muted">Continue to your classroom dashboard.</p>
  <label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label>
  <button class="btn btn-primary btn-full" type="submit">Log in</button>
  <p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form></section>
{% endblock %}
