{% extends "base.html" %}
{% block title %}Create account | ClassPoll{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="panel auth-panel" method="post">
  <div class="eyebrow">JOIN CLASSPOLL</div><h1>Create your account</h1><p class="muted">Choose the role that matches how you will use ClassPoll.</p>
  <label>Full name<input name="name" required maxlength="100" autocomplete="name" placeholder="Your name"></label>
  <label>Email address<input name="email" type="email" required maxlength="150" autocomplete="email" placeholder="you@example.com"></label>
  <label>Password <small>(minimum 8 characters)</small><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Create a password"></label>
  <label>Account type<select name="role" required><option value="">Select role</option><option value="student">Student</option><option value="teacher">Teacher</option></select></label>
  <button class="btn btn-primary btn-full" type="submit">Create account</button>
  <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</form></section>
{% endblock %}
